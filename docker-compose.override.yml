# ===========================================================================
#  docker-compose.override.yml  (for this CoA server)
# ---------------------------------------------------------------------------
# 1) acore_world comes from the versioned CoA world package inside the
#    checkout (apps/coa-world/world_data.py, driven by coa-world-data.sh) ->
#    the AzerothCore auto-updater (ac-db-import) is turned into a no-op so
#    that AC update SQL cannot overwrite the CoA content. Later migrations
#    arrive through apply-missing-updates.sh with normal updater semantics.
#    To re-enable it: rename this file and run "docker compose up ac-db-import".
#
# 2) ac-database runs without the binary log: a game database needs no
#    point-in-time recovery, and during the one-time package import the
#    binlog would almost double the space required.
#
# 3) Log rotation: keeps container logs from growing without limit
#    (max. 20 MB x 3 files per service).
#
# 4) ccache settings for the image build - the compiler cache that keeps a
#    rebuild at a few minutes instead of 45-120. The Dockerfile declares these
#    as build args, which BuildKit passes to the RUN step as environment
#    variables, and ccache reads them from there. The fork ships
#    CCACHE_MAXSIZE="1000MB", which ccache 4.x rejects (it expects "1000M") and
#    silently replaces with its 5 GB default - this makes it explicit.
#    Keep the values IDENTICAL for every service: the compile stage is shared,
#    two different values would compile the world twice.
#
# Note: coa-oneclick.sh installs this file automatically before the CoA world
#       package is imported.
# ===========================================================================

x-coa-ccache: &coa-ccache
  CCACHE_MAXSIZE: "5G"
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "9"

services:
  ac-db-import:
    entrypoint: ["/bin/sh", "-c", "echo 'ac-db-import disabled: acore_world comes from the versioned CoA world package'; exit 0"]
    build:
      args: *coa-ccache

  ac-database:
    command: ["--skip-log-bin"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  ac-worldserver:
    build:
      args: *coa-ccache
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  ac-authserver:
    build:
      args: *coa-ccache
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"